name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One run at a time per branch. A run waiting behind another is cancelled when a newer one
# queues, so cancelled runs are expected; the newest commit is always the one that runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    # The dev container's base image: the *-chromium-linux.png baselines were rendered in it,
    # and its Python covers test:beyer. scripts/check-version-lockstep.mjs keeps the three
    # copies of this tag and digest in step.
    container: node:24.20.0-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
      # The e2e preview server rebuilt dist/, so this is the build the CSP spec tested.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
